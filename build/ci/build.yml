name: build-gui

# Build SEB Config Bypass Studio untuk Windows (.exe) dan macOS (.app/.dmg).
#
# PyInstaller TIDAK bisa cross-compile, jadi tiap platform dibangun di runner
# platform itu sendiri. Hasilnya diunggah sebagai artifact dan, kalau dipicu
# oleh tag, ditempelkan ke GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Generate icons
        working-directory: build
        run: python make_icon.py

      - name: Build .exe
        working-directory: build
        run: pyinstaller --clean --noconfirm seb_bypass_gui_onefile.spec

      - name: Smoke test (headless)
        working-directory: build
        shell: pwsh
        run: |
          # exe ini GUI (console=False) - PowerShell TIDAK menunggu app GUI
          # kalau dipanggil dengan '&', jadi harus Start-Process -Wait.
          $env:SEB_GUI_SMOKE = "$env:GITHUB_WORKSPACE\build\smoke_in.seb"
          $env:SEB_GUI_SMOKE_OUT = "$env:GITHUB_WORKSPACE\build\smoke_out.seb"
          Copy-Item "$env:GITHUB_WORKSPACE\SebClientSettings.seb" $env:SEB_GUI_SMOKE
          $p = Start-Process -FilePath ".\dist\SEB Config Bypass Studio.exe" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (-not (Test-Path $env:SEB_GUI_SMOKE_OUT)) { throw "smoke test gagal: output tidak dibuat" }
          if ($p.ExitCode -ne 0) { throw "smoke test gagal: exit $($p.ExitCode)" }
          Write-Host "smoke test OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-Config-Bypass-Studio-Windows
          path: build/dist/SEB Config Bypass Studio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/SEB Config Bypass Studio.exe

  macos:
    name: macOS (.app/.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Generate icons
        working-directory: build
        run: python make_icon.py

      - name: Build .app
        working-directory: build
        run: pyinstaller --clean --noconfirm seb_bypass_gui.spec

      - name: Smoke test (headless)
        working-directory: build
        run: |
          export SEB_GUI_SMOKE="$GITHUB_WORKSPACE/build/smoke_in.seb"
          export SEB_GUI_SMOKE_OUT="$GITHUB_WORKSPACE/build/smoke_out.seb"
          cp "$GITHUB_WORKSPACE/SebClientSettings.seb" "$SEB_GUI_SMOKE"
          "./dist/SEB Config Bypass Studio.app/Contents/MacOS/SEB Config Bypass Studio"
          test -f "$SEB_GUI_SMOKE_OUT"

      - name: Package .dmg
        working-directory: build
        run: |
          hdiutil create -volname "SEB Config Bypass Studio" \
            -srcfolder "dist/SEB Config Bypass Studio.app" \
            -ov -format UDZO "SEB Config Bypass Studio.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-Config-Bypass-Studio-macOS
          path: |
            build/SEB Config Bypass Studio.dmg
            build/dist/SEB Config Bypass Studio.app

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SEB Config Bypass Studio.dmg
